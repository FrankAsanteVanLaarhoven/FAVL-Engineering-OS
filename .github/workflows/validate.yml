name: Validate Engineering OS
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One entry point on purpose. The previous revision ran a second,
      # inline secret grep whose pattern list matched the workflow file that
      # contained it, so the job failed on every commit regardless of content.
      # Patterns now live in .github/secret-patterns.txt, the scanner proves
      # itself against canaries before reporting a pass, and a local run and a
      # CI run execute identical code.
      - name: Validate policy repository
        run: ./scripts/validate-os.sh
